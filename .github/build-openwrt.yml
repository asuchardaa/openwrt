name: Build OpenWrt for Archer A9 v6 (25.12.4)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget libelf-dev perl

      - name: Clone OpenWrt 25.12.4
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout v25.12.4

      - name: Apply QCN5502 2.4GHz patch
        run: |
          cd openwrt
          git remote add spike0en https://github.com/spike0en/openwrt.git
          git fetch spike0en
          git cherry-pick --no-commit 5521d5daaf58a34ba229b3e4a8208cdd218440c9

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create .config
        run: |
          cd openwrt
          cat > .config << 'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_generic=y
          CONFIG_TARGET_ath79_generic_DEVICE_tplink_archer-a9-v6=y
          CONFIG_GETDNS_ENABLE_STUB_ONLY=y
          CONFIG_HTOP_LMSENSORS=y
          CONFIG_OPENSSL_ENGINE=y
          CONFIG_OPENSSL_PREFER_CHACHA_OVER_GCM=y
          CONFIG_OPENSSL_WITH_ASM=y
          CONFIG_OPENSSL_WITH_CHACHA_POLY1305=y
          CONFIG_OPENSSL_WITH_CMS=y
          CONFIG_OPENSSL_WITH_DEPRECATED=y
          CONFIG_OPENSSL_WITH_ERROR_MESSAGES=y
          CONFIG_OPENSSL_WITH_IDEA=y
          CONFIG_OPENSSL_WITH_MDC2=y
          CONFIG_OPENSSL_WITH_PSK=y
          CONFIG_OPENSSL_WITH_SEED=y
          CONFIG_OPENSSL_WITH_SRP=y
          CONFIG_OPENSSL_WITH_TLS13=y
          CONFIG_OPENSSL_WITH_WHIRLPOOL=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_cgi-io=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_gawk=y
          CONFIG_PACKAGE_getdns=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_ip-tiny=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_kmod-crypto-lib-chacha20=y
          CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=y
          CONFIG_PACKAGE_kmod-crypto-lib-curve25519=y
          CONFIG_PACKAGE_kmod-crypto-lib-poly1305=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-ifb=y
          CONFIG_PACKAGE_kmod-ipt-core=y
          CONFIG_PACKAGE_kmod-ipt-ipopt=y
          CONFIG_PACKAGE_kmod-lib-crc16=y
          CONFIG_PACKAGE_kmod-nf-ipt=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_kmod-sched-core=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_kmod-udptunnel4=y
          CONFIG_PACKAGE_kmod-udptunnel6=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_libatomic=y
          CONFIG_PACKAGE_libblkid=y
          CONFIG_PACKAGE_libcap=y
          CONFIG_PACKAGE_libcomerr=y
          CONFIG_PACKAGE_libe2p=y
          CONFIG_PACKAGE_libevdev=y
          CONFIG_PACKAGE_libext2fs=y
          CONFIG_PACKAGE_libiptext=y
          CONFIG_PACKAGE_libiptext-nft=y
          CONFIG_PACKAGE_libiptext6=y
          CONFIG_PACKAGE_liblucihttp=y
          CONFIG_PACKAGE_liblucihttp-ucode=y
          CONFIG_PACKAGE_libncurses=y
          CONFIG_PACKAGE_libopenssl=y
          CONFIG_PACKAGE_libparted=y
          CONFIG_PACKAGE_libpcre2=y
          CONFIG_PACKAGE_libreadline=y
          CONFIG_PACKAGE_librt=y
          CONFIG_PACKAGE_libss=y
          CONFIG_PACKAGE_libudev-zero=y
          CONFIG_PACKAGE_libusb-1.0=y
          CONFIG_PACKAGE_libuuid=y
          CONFIG_PACKAGE_libuv=y
          CONFIG_PACKAGE_libwebsockets-full=y
          CONFIG_PACKAGE_libxtables=y
          CONFIG_PACKAGE_libyaml=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-lib-uqr=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-status=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_parted=y
          CONFIG_PACKAGE_resolveip=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-file=y
          CONFIG_PACKAGE_rpcd-mod-iwinfo=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_rpcd-mod-rrdns=y
          CONFIG_PACKAGE_rpcd-mod-ucode=y
          CONFIG_PACKAGE_sed=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_stubby=y
          CONFIG_PACKAGE_tc-tiny=y
          CONFIG_PACKAGE_terminfo=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_ucode-mod-html=y
          CONFIG_PACKAGE_ucode-mod-math=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_usbids=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_xtables-nft=y
          CONFIG_PACKAGE_zlib=y
          CONFIG_PARTED_READLINE=y
          EOF
          make defconfig

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tail -50

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-archer-a9-v6-25.12.4
          path: openwrt/bin/targets/ath79/generic/*archer-a9*
          retention-days: 7
